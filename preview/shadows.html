<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:34px 30px}
  .row{display:flex;gap:26px;align-items:center;justify-content:space-between}
  .item{display:flex;flex-direction:column;align-items:center;gap:14px}
  .box{width:88px;height:62px;background:var(--surface);border-radius:10px;border:1px solid var(--line)}
  .n{font-size:10px;letter-spacing:.08em;color:var(--ink);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="n">xl</span></div>
  </div>
</body></html>
