<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper-2);font-family:var(--font-sans);padding:26px 30px;display:flex;gap:20px}
  .card{width:300px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-xs)}
  .thumb{position:relative;aspect-ratio:4/3;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ov{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(to top,rgba(0,0,0,.5),transparent);opacity:0;transition:opacity var(--dur-base)}
  .card:hover .ov{opacity:1}
  .acts{position:absolute;right:10px;bottom:10px;display:flex;gap:7px;opacity:0;transform:translateY(4px);transition:all var(--dur-base) var(--ease-out)}
  .card:hover .acts{opacity:1;transform:none}
  .acts button{width:32px;height:32px;border-radius:7px;border:none;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer}
  .acts i{width:16px;height:16px;color:var(--ink)}
  .foot{display:flex;align-items:center;gap:10px;padding:11px 13px}
  .foot>div:nth-child(2){flex:1;min-width:0}
  .av{width:28px;height:28px;border-radius:50%;background:var(--jade);color:#fff;font-family:var(--font-mono);font-size:11px;display:grid;place-items:center;flex:none}
  .ti{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .by{font-size:12px;color:var(--fg-3)}
  .ap{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-2)}
  .ap i{width:14px;height:14px;color:var(--accent)}
</style></head>
<body>
  <div class="card">
    <div class="thumb"><img src="../assets/artwork/work-04.png"><div class="ov"></div>
      <div class="acts"><button><i data-lucide="heart"></i></button><button><i data-lucide="bookmark"></i></button></div>
    </div>
    <div class="foot"><div class="av">RA</div><div><div class="ti">Quiet Type</div><div class="by">Rune Aalto</div></div>
      <span class="ap"><i data-lucide="heart" fill="currentColor"></i>1.2k</span></div>
  </div>
  <div class="card">
    <div class="thumb"><img src="../assets/artwork/work-08.png"><div class="ov"></div>
      <div class="acts"><button><i data-lucide="heart"></i></button><button><i data-lucide="bookmark"></i></button></div>
    </div>
    <div class="foot"><div class="av" style="background:var(--accent)">MS</div><div><div class="ti">Chroma Studies</div><div class="by">Mira Sol</div></div>
      <span class="ap"><i data-lucide="heart" fill="currentColor"></i>842</span></div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
