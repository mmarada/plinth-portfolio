<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:0;display:flex}
  .pane{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px 20px}
  .dark{background:var(--ink)}
  .mark{display:flex;align-items:center;gap:12px}
  .glyph{width:34px;height:34px;flex:none}
  .wm{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.5px}
  .lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
  .dark .lab{color:#8a8475}
</style></head>
<body>
  <div class="pane">
    <img class="glyph" style="width:60px;height:60px" src="../assets/plinth-logomark.svg">
    <span class="lab">Logomark</span>
  </div>
  <div class="pane">
    <div class="mark"><img class="glyph" src="../assets/plinth-logomark.svg"><span class="wm" style="color:var(--ink)">Plinth</span></div>
    <span class="lab">Wordmark · light</span>
  </div>
  <div class="pane dark">
    <div class="mark"><img class="glyph" src="../assets/plinth-logomark.svg"><span class="wm" style="color:var(--paper)">Plinth</span></div>
    <span class="lab">Wordmark · dark</span>
  </div>
</body></html>
