<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:28px 32px;color:var(--ink)}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding:14px 0}
  .row:last-child{border-bottom:0}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);width:120px;flex:none}
  .spec{font-family:var(--font-display);color:var(--ink);line-height:1.0}
</style></head>
<body>
  <div class="row"><span class="tag">Display · 88</span><span class="spec" style="font-size:56px;font-weight:500;letter-spacing:-.02em">On&nbsp;display</span></div>
  <div class="row"><span class="tag">H1 · 48</span><span class="spec" style="font-size:40px;font-weight:500;letter-spacing:-.02em">The gallery wall</span></div>
  <div class="row"><span class="tag">H2 · 36</span><span class="spec" style="font-size:30px;font-weight:500;letter-spacing:-.015em">Featured projects</span></div>
  <div class="row"><span class="tag">Lead · 28 italic</span><span class="spec" style="font-size:24px;font-style:italic;font-weight:400;color:var(--fg-2)">A portfolio for people who care how their work is seen.</span></div>
</body></html>
