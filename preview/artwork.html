<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:22px 26px}
  .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .t{aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .t img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body>
  <div class="lab">Placeholder design-work tiles · stand-in user content</div>
  <div class="grid">

    <div class="t"><img src="../assets/artwork/work-06.png"></div>
    <div class="t"><img src="../assets/artwork/work-07.png"></div>
    <div class="t"><img src="../assets/artwork/work-09.png"></div>
    <div class="t"><img src="../assets/artwork/work-10.png"></div>
    <div class="t"><img src="../assets/artwork/work-12.png"></div>
    <div class="t"><img src="../assets/artwork/work-02.png"></div>
    <div class="t"><img src="../assets/artwork/work-04.png"></div>
    <div class="t"><img src="../assets/artwork/work-05.png"></div>
    <div class="t"><img src="../assets/artwork/work-11.png"></div>
    <div class="t"><img src="../assets/artwork/work-08.png"></div>
  </div>
</body></html>
