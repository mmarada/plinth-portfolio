<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:24px 28px;color:var(--ink)}
  .head{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:7px}
  .chip{height:58px;border-radius:8px;border:1px solid var(--line-2)}
  .n{font-size:10px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
  .h{font-size:10px;color:var(--fg-3)}
</style></head>
<body>
  <div class="head">Night at the gallery · dark theme</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="n">Paper</span><span class="h">#141310</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><span class="n">Surface</span><span class="h">#201E18</span></div>
    <div class="sw"><div class="chip" style="background:var(--line-2)"></div><span class="n">Line</span><span class="h">#3A362B</span></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><span class="n">Ink</span><span class="h">#F2EDE2</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><span class="n">Accent</span><span class="h">#E0543A</span></div>
  </div>
</body></html>
