<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:24px 30px}
  .r{display:flex;align-items:center;gap:14px;padding:4px 0}
  .n{width:64px;font-size:10px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
  .v{width:40px;font-size:10px;color:var(--fg-3);text-align:right}
  .bar{height:14px;background:var(--accent);border-radius:3px}
</style></head>
<body>
  <div class="r"><span class="n">sp-1</span><span class="v">4</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="n">sp-2</span><span class="v">8</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="n">sp-3</span><span class="v">12</span><div class="bar" style="width:12px"></div></div>
  <div class="r"><span class="n">sp-4</span><span class="v">16</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="n">sp-5</span><span class="v">24</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="n">sp-6</span><span class="v">32</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="n">sp-7</span><span class="v">48</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="n">sp-8</span><span class="v">64</span><div class="bar" style="width:64px"></div></div>
  <div class="r"><span class="n">sp-9</span><span class="v">96</span><div class="bar" style="width:96px"></div></div>
  <div class="r"><span class="n">sp-10</span><span class="v">128</span><div class="bar" style="width:128px"></div></div>
</body></html>
