<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:26px 30px}
  .row{display:flex;gap:20px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:9px}
  .box{width:84px;height:64px;background:var(--surface);border:1.5px solid var(--ink)}
  .n{font-size:10px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
  .v{font-size:10px;color:var(--fg-3)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--r-xs)"></div><span class="n">xs</span><span class="v">3px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><span class="n">sm</span><span class="v">6px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><span class="n">md</span><span class="v">10px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><span class="n">lg</span><span class="v">16px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-xl)"></div><span class="n">xl</span><span class="v">24px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-pill);width:64px"></div><span class="n">pill</span><span class="v">999px</span></div>
  </div>
</body></html>
