<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono);padding:30px 32px;color:var(--ink)}
  .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .chip{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px}
  .num{font-size:13px;letter-spacing:.06em;color:var(--fg-3);font-variant-numeric:tabular-nums;margin-top:22px;display:flex;gap:28px}
  .num b{color:var(--accent);font-weight:700}
</style></head>
<body>
  <div class="lab">Branding&nbsp;·&nbsp;2025&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;Exhibited&nbsp;Mar&nbsp;2025</div>
  <div class="chips">
    <span class="chip">Type Design</span>
    <span class="chip">Editorial</span>
    <span class="chip">Motion</span>
    <span class="chip">3D · Render</span>
  </div>
  <div class="num"><span>NO.&nbsp;<b>014</b>&nbsp;/&nbsp;240</span><span>1.2k&nbsp;appreciations</span><span>48&nbsp;comments</span></div>
</body></html>
