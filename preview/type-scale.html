<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-display);padding:22px 32px;color:var(--ink)}
  .r{display:flex;align-items:baseline;gap:18px;padding:5px 0}
  .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--fg-3);width:84px;flex:none;text-align:right}
  .s{line-height:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
  <div class="r"><span class="t">88 / 5xl</span><span class="s" style="font-size:50px">Display</span></div>
  <div class="r"><span class="t">64 / 4xl</span><span class="s" style="font-size:40px">Headline</span></div>
  <div class="r"><span class="t">48 / 3xl</span><span class="s" style="font-size:32px">Section</span></div>
  <div class="r"><span class="t">36 / 2xl</span><span class="s" style="font-size:26px">Subhead</span></div>
  <div class="r"><span class="t">28 / xl</span><span class="s" style="font-size:21px">Lead text</span></div>
  <div class="r"><span class="t">18 / md</span><span class="s" style="font-size:17px;font-family:var(--font-sans)">Body large</span></div>
  <div class="r"><span class="t">16 / base</span><span class="s" style="font-size:16px;font-family:var(--font-sans)">Body / UI default</span></div>
  <div class="r"><span class="t">14 / sm</span><span class="s" style="font-size:14px;font-family:var(--font-sans);color:var(--fg-3)">Caption · meta</span></div>
</body></html>
