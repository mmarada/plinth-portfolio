<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasa — Onboarding · Plinth Portfolio</title>
<link rel="stylesheet" href="portfolio.css">
<style>html,body{background:#e7e0d0}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
// ── frame.jsx ──────────────────────────────────────────────────────────────
function StatusBar({ tint = 'dark', time = '9:41' }) {
  const c = tint === 'light' ? '#fff' : 'var(--ink)';
  return (
    <div style={{ position:'absolute',top:0,left:0,right:0,height:54,zIndex:40,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 30px 0',pointerEvents:'none' }}>
      <span style={{ fontFamily:'var(--font-sans)',fontWeight:700,fontSize:15,color:c,letterSpacing:'.02em' }}>{time}</span>
      <div style={{ display:'flex',gap:6,alignItems:'center' }}>
        <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".6" fill={c}/><rect x="4.5" y="4.5" width="3" height="6.5" rx=".6" fill={c}/><rect x="9" y="2" width="3" height="9" rx=".6" fill={c}/><rect x="13.5" y="0" width="3" height="11" rx=".6" fill={c} fillOpacity=".4"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.8c2.1 0 4 .8 5.4 2.2l1-1C12.7 2.2 10.4 1.1 8 1.1S3.3 2.2 1.6 4l1 1C4 3.6 5.9 2.8 8 2.8z" fill={c}/><path d="M8 6.1c1.2 0 2.3.5 3.1 1.3l1-1C11 5.3 9.6 4.7 8 4.7s-3 .6-4.1 1.7l1 1C5.7 6.6 6.8 6.1 8 6.1z" fill={c}/><circle cx="8" cy="9.4" r="1.3" fill={c}/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke={c} strokeOpacity=".4" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill={c}/><path d="M23 4v4c.7-.3 1.2-1 1.2-2S23.7 4.3 23 4z" fill={c} fillOpacity=".5"/></svg>
      </div>
    </div>
  );
}

function PhoneFrame({ children, tint = 'dark', bg = '#000', w = 390, h = 844, shadow = true }) {
  return (
    <div style={{ width:w,height:h,borderRadius:54,position:'relative',background:bg,overflow:'hidden',boxShadow:shadow?'0 50px 100px -20px rgba(40,28,12,.45), 0 0 0 10px #14110c, 0 0 0 12px #2a241a':'none',fontFamily:'var(--font-sans)',flexShrink:0 }}>
      <div style={{ position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:116,height:34,borderRadius:20,background:'#000',zIndex:50 }} />
      <StatusBar tint={tint} />
      <div style={{ position:'absolute',inset:0,overflow:'hidden' }}>{children}</div>
      <div style={{ position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:100,background:tint==='light'?'rgba(255,255,255,.65)':'rgba(20,16,10,.32)',zIndex:60,pointerEvents:'none' }} />
    </div>
  );
}

function Dots({ n, i, color = 'var(--ink)', dim = 'rgba(0,0,0,.18)' }) {
  return (
    <div style={{ display:'flex',gap:6,alignItems:'center' }}>
      {Array.from({ length:n }).map((_,k) => (
        <div key={k} style={{ height:6,borderRadius:99,width:k===i?20:6,background:k===i?color:dim,transition:'all .35s var(--ease)' }} />
      ))}
    </div>
  );
}

function AppButton({ children, onClick, bg = 'var(--ink)', color = 'var(--cream)', style = {}, ghost = false, disabled = false }) {
  const [press, setPress] = React.useState(false);
  const base = ghost ? { background:'transparent',color:bg,border:'1.5px solid currentColor' } : { background:bg,color };
  return (
    <button onClick={disabled?undefined:onClick}
      onPointerDown={() => setPress(true)} onPointerUp={() => setPress(false)} onPointerLeave={() => setPress(false)}
      style={{ width:'100%',height:56,borderRadius:16,fontFamily:'var(--font-sans)',fontSize:16,fontWeight:600,letterSpacing:'.01em',display:'flex',alignItems:'center',justifyContent:'center',gap:9,transition:'transform .12s var(--ease), opacity .2s, filter .15s',transform:press?'translateY(1px) scale(.99)':'none',filter:press?'brightness(.94)':'none',opacity:disabled?.4:1,cursor:disabled?'not-allowed':'pointer',...base,...style }}>{children}</button>
  );
}

function Stamp({ children, color = 'var(--gold)', style = {} }) {
  return <div className="mono-label" style={{ color,...style }}>{children}</div>;
}

function Spinner({ size = 22, color = 'currentColor' }) {
  return <div style={{ width:size,height:size,borderRadius:'50%',border:`2.5px solid ${color}`,borderTopColor:'transparent',animation:'spinSlow .8s linear infinite' }} />;
}

function useStep(initial = 0) {
  const [i, setI] = React.useState(initial);
  const go = React.useCallback((n) => setI(n), []);
  const next = React.useCallback(() => setI(v => v + 1), []);
  const back = React.useCallback(() => setI(v => Math.max(0, v - 1)), []);
  return { i, go, next, back, setI };
}

function Stage({ width, height, children, bg = 'radial-gradient(120% 80% at 50% -10%, #efe9dc 0%, #e7e0d0 55%, #ddd4c0 100%)' }) {
  const [s, setS] = React.useState(1);
  React.useEffect(() => {
    const fit = () => setS(Math.min(1, (window.innerWidth - 32) / width, (window.innerHeight - 32) / height));
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, [width, height]);
  return (
    <div style={{ width:'100vw',height:'100vh',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center',background:bg }}>
      <div style={{ width,height,transform:`scale(${s})`,transformOrigin:'center center',position:'relative',flexShrink:0 }}>{children}</div>
    </div>
  );
}

// ── rasa.jsx ───────────────────────────────────────────────────────────────
const { useState, useEffect, useRef } = React;
const A = 'assets/art/';

const NOTES = [
  { stage:'Internal trigger', n:'01', title:'Anchor to an emotion, not a feature', body:'The promise is a single sentence and a single verb. Rasa attaches to the quiet wish to feel something — the internal trigger the daily loop will later answer.' },
  { stage:'Investment · personalize', n:'02', title:'A small effort, paid early', body:'Picking what moves you is low-cost but real. That first bit of work tailors every future trigger and starts the IKEA effect — people value what they\'ve shaped.' },
  { stage:'The loop, taught', n:'03', title:'Set the ritual expectation', body:'Before asking for anything, show the shape of the habit: one nudge, one artwork, one moment. Clear mental models lower the cost of the first action.' },
  { stage:'External trigger', n:'04', title:'Permission, framed as a gift', body:'Not "Enable notifications" — "one quiet nudge each morning." Benefit-first content design earns the opt-in that powers the whole Hook loop.' },
  { stage:'Variable reward', n:'05', title:'Unveil, never just display', body:'Tap-to-reveal manufactures a beat of anticipation, and the artwork changes daily — a reward of the hunt. Variability is what keeps the ritual from going stale.' },
  { stage:'Investment · store value', n:'06', title:'Let them leave something behind', body:'Saving to a collection stores value in the product and loads the next trigger ("see your collection grow"). Investment, in Hook terms — and the switching cost rises.' },
  { stage:'Loop closed', n:'07', title:'Commit the streak, queue tomorrow', body:'The streak is a commitment device; tomorrow\'s artwork is already promised. The loop now runs on its own — trigger, action, reward, investment, repeat.' },
];

const FORMS = [
  { k:'madhubani', label:'Madhubani', img:'mandala-vermillion.png' },
  { k:'pichwai',   label:'Pichwai',   img:'lotus-maroon.png' },
  { k:'miniature', label:'Miniature', img:'torana-day.png' },
  { k:'contemporary', label:'Contemporary', img:'cont-2.png' },
  { k:'sculpture', label:'Sculpture', img:'cont-4.png' },
  { k:'textile',   label:'Textile',   img:'fan-indigo.png' },
];

const REVEAL = {
  img:'surya-indigo.png', title:'Surya, at the Threshold', artist:'Workshop of Madhubani, Bihar',
  year:'c. 1970', note:'A sun-disc painted at a doorway to greet the day. The radiating gold is laid in a single breath — no pencil, no second chance.',
};

function Screen({ bg, children, pad = 30 }) {
  return <div className="rise" key={Math.random()} style={{ position:'absolute',inset:0,background:bg,padding:`64px ${pad}px 40px`,display:'flex',flexDirection:'column',overflow:'hidden' }}>{children}</div>;
}

function Welcome({ next }) {
  return (
    <div style={{ position:'absolute',inset:0,background:'var(--indigo)',overflow:'hidden' }}>
      <img src={A+'surya-cream.png'} style={{ position:'absolute',width:520,height:520,top:30,left:'50%',transform:'translateX(-50%)',opacity:.16,animation:'spinSlow 70s linear infinite',mixBlendMode:'screen' }} />
      <div style={{ position:'absolute',inset:0,padding:'90px 36px 44px',display:'flex',flexDirection:'column',color:'var(--cream)' }}>
        <div className="mono-label" style={{ color:'var(--marigold)' }}>Rasa · रस</div>
        <div style={{ flex:1 }} />
        <h1 className="serif" style={{ fontSize:52,fontWeight:500,lineHeight:1.02,letterSpacing:'-.02em',margin:'0 0 18px' }}>One artwork,<br/><span style={{ fontStyle:'italic',color:'var(--marigold)' }}>every day.</span></h1>
        <p style={{ fontSize:17,lineHeight:1.55,color:'rgba(251,244,230,.72)',margin:'0 0 34px',maxWidth:300 }}>A daily ritual of looking. Five quiet minutes with one beautiful thing — and the stories behind it.</p>
        <AppButton onClick={next} bg="var(--marigold)" color="var(--indigo)">Begin <span style={{ fontSize:18 }}>→</span></AppButton>
        <div style={{ textAlign:'center',marginTop:16,fontSize:13,color:'rgba(251,244,230,.5)' }}>Already have an account? <span style={{ color:'var(--cream)',textDecoration:'underline' }}>Sign in</span></div>
      </div>
    </div>
  );
}

function Interests({ next, sel, setSel }) {
  const toggle = k => setSel(s => s.includes(k) ? s.filter(x => x !== k) : [...s, k]);
  const ok = sel.length >= 2;
  return (
    <Screen bg="var(--cream)">
      <Stamp color="var(--terracotta)">Step 01 — Your eye</Stamp>
      <h2 className="serif" style={{ fontSize:32,fontWeight:500,lineHeight:1.08,letterSpacing:'-.02em',color:'var(--ink)',margin:'14px 0 4px' }}>What moves you?</h2>
      <p style={{ fontSize:14.5,color:'var(--maroon)',opacity:.7,margin:'0 0 18px' }}>Pick two or more. We'll tune your daily artwork to them.</p>
      <div style={{ flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:11,overflow:'auto',paddingBottom:8 }}>
        {FORMS.map(f => {
          const on = sel.includes(f.k);
          return (
            <button key={f.k} onClick={() => toggle(f.k)} style={{ position:'relative',borderRadius:16,overflow:'hidden',aspectRatio:'1',padding:0,boxShadow:on?'0 0 0 3px var(--vermillion), 0 8px 20px rgba(110,30,42,.2)':'0 1px 3px rgba(0,0,0,.1)',transition:'box-shadow .2s var(--ease), transform .2s var(--ease)',transform:on?'scale(.97)':'none' }}>
              <img src={A+f.img} style={{ width:'100%',height:'100%',objectFit:'cover',display:'block' }} />
              <div style={{ position:'absolute',inset:0,background:on?'linear-gradient(to top, rgba(26,20,16,.78), rgba(26,20,16,.12))':'linear-gradient(to top, rgba(26,20,16,.62), transparent 60%)' }} />
              <span style={{ position:'absolute',left:12,bottom:11,color:'#fff',fontWeight:600,fontSize:15 }}>{f.label}</span>
              <div style={{ position:'absolute',right:10,top:10,width:24,height:24,borderRadius:'50%',background:on?'var(--vermillion)':'rgba(255,255,255,.25)',border:on?'none':'1.5px solid rgba(255,255,255,.7)',display:'grid',placeItems:'center',transition:'all .2s' }}>
                {on && <svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 7l3 3 6-7" stroke="#fff" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
            </button>
          );
        })}
      </div>
      <div style={{ display:'flex',alignItems:'center',gap:14,marginTop:12 }}>
        <span className="mono-label tabnum" style={{ color:'var(--maroon)',opacity:.55,flexShrink:0 }}>{sel.length} chosen</span>
        <AppButton onClick={next} disabled={!ok} bg="var(--ink)" color="var(--cream)" style={{ height:52 }}>Continue</AppButton>
      </div>
    </Screen>
  );
}

function HowItWorks({ next }) {
  const rows = [
    { t:'A quiet nudge', d:'One notification each morning — never more.', img:'torana-night.png' },
    { t:'One artwork', d:'Unveiled just for you, with its story.', img:'surya-indigo.png' },
    { t:'Keep what stays with you', d:'Save it. Watch your collection grow.', img:'lotus-indigo.png' },
  ];
  return (
    <div style={{ position:'absolute',inset:0,background:'var(--maroon)',padding:'64px 30px 40px',display:'flex',flexDirection:'column',color:'var(--cream)' }} className="rise">
      <Stamp color="var(--marigold)">The ritual</Stamp>
      <h2 className="serif" style={{ fontSize:32,fontWeight:500,lineHeight:1.08,letterSpacing:'-.02em',margin:'14px 0 22px' }}>How Rasa works</h2>
      <div style={{ flex:1,display:'flex',flexDirection:'column',gap:16 }}>
        {rows.map((r,i) => (
          <div key={i} style={{ display:'flex',gap:16,alignItems:'center',animation:`riseIn .5s var(--ease) both`,animationDelay:`${i*.12}s` }}>
            <div style={{ width:66,height:66,borderRadius:14,overflow:'hidden',flexShrink:0,boxShadow:'0 6px 16px rgba(0,0,0,.3)' }}><img src={A+r.img} style={{ width:'100%',height:'100%',objectFit:'cover' }} /></div>
            <div>
              <div className="mono-label" style={{ color:'var(--marigold)',marginBottom:4 }}>0{i+1}</div>
              <div style={{ fontWeight:600,fontSize:17,marginBottom:2 }}>{r.t}</div>
              <div style={{ fontSize:14,color:'rgba(251,244,230,.66)',lineHeight:1.4 }}>{r.d}</div>
            </div>
          </div>
        ))}
      </div>
      <AppButton onClick={next} bg="var(--marigold)" color="var(--maroon)">I'm ready</AppButton>
    </div>
  );
}

function Notify({ next }) {
  const [show, setShow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setShow(true), 500); return () => clearTimeout(t); }, []);
  return (
    <Screen bg="var(--cream)">
      <Stamp color="var(--terracotta)">Step 02 — Your morning</Stamp>
      <h2 className="serif" style={{ fontSize:31,fontWeight:500,lineHeight:1.1,letterSpacing:'-.02em',color:'var(--ink)',margin:'14px 0 6px' }}>A single, quiet nudge</h2>
      <p style={{ fontSize:15,color:'var(--maroon)',opacity:.75,margin:'0 0 24px',lineHeight:1.5 }}>We'll send one notification each morning — your artwork, waiting. No streaks of alerts, ever.</p>
      <div style={{ flex:1,display:'flex',alignItems:'center',justifyContent:'center' }}>
        <div style={{ width:'100%',background:'rgba(255,255,255,.7)',backdropFilter:'blur(8px)',borderRadius:22,padding:'14px 16px',display:'flex',gap:12,alignItems:'center',boxShadow:'0 12px 30px rgba(110,30,42,.16)',transform:show?'translateY(0) scale(1)':'translateY(-16px) scale(.96)',opacity:show?1:0,transition:'all .5s var(--ease)' }}>
          <div style={{ width:42,height:42,borderRadius:11,overflow:'hidden',flexShrink:0 }}><img src={A+'mandala-jade.png'} style={{ width:'100%',height:'100%',objectFit:'cover' }} /></div>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex',justifyContent:'space-between',alignItems:'baseline' }}><span style={{ fontWeight:700,fontSize:13.5,color:'var(--ink)' }}>RASA</span><span style={{ fontSize:12,color:'var(--fg-3,#8C8678)' }}>now</span></div>
            <div style={{ fontSize:13.5,color:'var(--ink)',lineHeight:1.35,marginTop:1 }}>Today's artwork is ready. A surya to greet the morning. ☀</div>
          </div>
        </div>
      </div>
      <div style={{ display:'flex',flexDirection:'column',gap:10 }}>
        <AppButton onClick={next} bg="var(--vermillion)" color="#fff">Send me my morning artwork</AppButton>
        <button onClick={next} style={{ height:44,color:'var(--maroon)',opacity:.55,fontSize:14.5,fontWeight:500 }}>Not now</button>
      </div>
    </Screen>
  );
}

function Reveal({ next }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ position:'absolute',inset:0,background:'var(--ink)',padding:'64px 30px 40px',display:'flex',flexDirection:'column',color:'var(--cream)' }} className="rise">
      <Stamp color="var(--marigold)">Today · No. 001</Stamp>
      <div style={{ flex:1,display:'flex',flexDirection:'column',justifyContent:'center' }}>
        <div onClick={() => setOpen(true)} style={{ position:'relative',borderRadius:18,overflow:'hidden',aspectRatio:'4/5',cursor:open?'default':'pointer',boxShadow:'0 30px 60px rgba(0,0,0,.5)',marginBottom:18 }}>
          <img src={A+REVEAL.img} style={{ width:'100%',height:'100%',objectFit:'cover',transform:open?'scale(1)':'scale(1.12)',filter:open?'none':'blur(14px) brightness(.6)',transition:'transform 1.1s var(--ease), filter 1s var(--ease)' }} />
          {!open && (
            <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,background:'rgba(27,42,107,.32)' }}>
              <div style={{ width:64,height:64,borderRadius:'50%',border:'1.5px solid rgba(251,244,230,.6)',display:'grid',placeItems:'center',animation:'fadeIn 1s both' }}>
                <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 1c5.5 0 10 4.5 10 10s-4.5 10-10 10S1 16.5 1 11" stroke="var(--marigold)" strokeWidth="1.5" fill="none" strokeLinecap="round"/><circle cx="11" cy="11" r="3" fill="var(--marigold)"/></svg>
              </div>
              <span className="mono-label" style={{ color:'var(--cream)' }}>Tap to unveil</span>
            </div>
          )}
        </div>
        {open && (
          <div style={{ animation:'riseIn .6s var(--ease) both' }}>
            <h2 className="serif" style={{ fontSize:26,fontWeight:500,fontStyle:'italic',lineHeight:1.12,margin:'0 0 6px' }}>{REVEAL.title}</h2>
            <div className="mono-label" style={{ color:'var(--marigold)',marginBottom:10 }}>{REVEAL.artist} · {REVEAL.year}</div>
            <p style={{ fontSize:14.5,lineHeight:1.55,color:'rgba(251,244,230,.74)',margin:0 }}>{REVEAL.note}</p>
          </div>
        )}
      </div>
      {open && <AppButton onClick={next} bg="var(--marigold)" color="var(--ink)" style={{ animation:'riseIn .6s var(--ease) .15s both' }}>Save to my collection</AppButton>}
    </div>
  );
}

function Save({ next }) {
  const [saved, setSaved] = useState(false);
  useEffect(() => { const t = setTimeout(() => setSaved(true), 650); return () => clearTimeout(t); }, []);
  return (
    <Screen bg="var(--cream)">
      <div style={{ flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center' }}>
        <div style={{ position:'relative',width:168,height:210,marginBottom:30 }}>
          <img src={A+REVEAL.img} style={{ width:130,height:162,objectFit:'cover',borderRadius:12,position:'absolute',left:'50%',top:0,transform:`translateX(-50%) ${saved?'translateY(8px) rotate(-3deg) scale(.96)':'translateY(-10px) scale(1.04)'}`,boxShadow:'0 18px 40px rgba(110,30,42,.28)',transition:'transform .7s var(--ease)' }} />
          <div style={{ position:'absolute',left:'50%',bottom:0,transform:'translateX(-50%)',width:60,height:60,borderRadius:'50%',background:saved?'var(--vermillion)':'var(--cream-2)',display:'grid',placeItems:'center',boxShadow:'0 8px 20px rgba(110,30,42,.2)',transition:'background .4s',zIndex:2 }}>
            <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill={saved?'#fff':'none'} stroke={saved?'#fff':'var(--maroon)'} strokeWidth="1.8" style={{ transition:'all .4s' }}/></svg>
          </div>
        </div>
        <h2 className="serif" style={{ fontSize:28,fontWeight:500,color:'var(--ink)',margin:'0 0 8px',opacity:saved?1:0,transition:'opacity .4s .2s' }}>Added to your collection</h2>
        <p style={{ fontSize:15,color:'var(--maroon)',opacity:saved?.72:0,maxWidth:280,lineHeight:1.5,transition:'opacity .4s .3s' }}>One down. Come back tomorrow and it grows — a small museum, only yours.</p>
      </div>
      <AppButton onClick={next} bg="var(--ink)" color="var(--cream)" style={{ opacity:saved?1:.4 }}>See my collection</AppButton>
    </Screen>
  );
}

function Home({ restart }) {
  const grid = ['surya-indigo.png','lotus-maroon.png','mandala-jade.png','torana-day.png','fan-indigo.png','cont-2.png'];
  return (
    <div style={{ position:'absolute',inset:0,background:'var(--cream)',display:'flex',flexDirection:'column' }} className="rise">
      <div style={{ padding:'64px 26px 0',display:'flex',justifyContent:'space-between',alignItems:'center' }}>
        <div><div className="mono-label" style={{ color:'var(--terracotta)' }}>Good morning</div><div className="serif" style={{ fontSize:25,fontWeight:500,color:'var(--ink)' }}>Your gallery</div></div>
        <div style={{ display:'flex',alignItems:'center',gap:6,background:'var(--maroon)',color:'var(--marigold)',padding:'7px 13px',borderRadius:99 }}>
          <svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-2 1-3 1-3s-1 4 2 4 2-4 1-6 1-4-2-4z" fill="var(--marigold)"/></svg>
          <span className="mono-label tabnum" style={{ color:'var(--marigold)' }}>Day 1</span>
        </div>
      </div>
      <div style={{ padding:'18px 22px 0',flex:1,overflow:'auto' }}>
        <div style={{ position:'relative',borderRadius:18,overflow:'hidden',marginBottom:20,boxShadow:'0 16px 36px rgba(110,30,42,.18)' }}>
          <img src={A+REVEAL.img} style={{ width:'100%',height:220,objectFit:'cover',display:'block' }} />
          <div style={{ position:'absolute',inset:0,background:'linear-gradient(to top, rgba(26,20,16,.8), transparent 55%)' }} />
          <div style={{ position:'absolute',left:16,right:16,bottom:14 }}>
            <div className="mono-label" style={{ color:'var(--marigold)',marginBottom:4 }}>Today's reveal</div>
            <div className="serif" style={{ fontSize:21,fontWeight:500,fontStyle:'italic',color:'#fff' }}>{REVEAL.title}</div>
          </div>
        </div>
        <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12 }}>
          <span className="mono-label" style={{ color:'var(--maroon)',opacity:.6 }}>Collection · 1 saved</span>
          <span style={{ fontSize:13,color:'var(--terracotta)',fontWeight:600 }}>Tomorrow in 18h</span>
        </div>
        <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,paddingBottom:20 }}>
          {grid.map((g,i) => (
            <div key={i} style={{ aspectRatio:'1',borderRadius:10,overflow:'hidden',position:'relative',opacity:i===0?1:.32 }}>
              <img src={A+g} style={{ width:'100%',height:'100%',objectFit:'cover' }} />
              {i!==0 && <div style={{ position:'absolute',inset:0,background:'rgba(251,244,230,.55)',display:'grid',placeItems:'center' }}><svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="var(--maroon)" strokeWidth="1.8"/><path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="var(--maroon)" strokeWidth="1.8"/></svg></div>}
            </div>
          ))}
        </div>
      </div>
      <div style={{ borderTop:'1px solid rgba(110,30,42,.12)',padding:'12px 40px 26px',display:'flex',justifyContent:'space-between',alignItems:'center' }}>
        {['Today','Collection','Atlas'].map((t,i) => <span key={t} style={{ fontSize:13,fontWeight:i===0?700:500,color:i===0?'var(--vermillion)':'rgba(110,30,42,.45)' }}>{t}</span>)}
        <button onClick={restart} className="mono-label" style={{ color:'var(--maroon)',opacity:.4 }}>↺ Replay</button>
      </div>
    </div>
  );
}

function Placard({ note, on }) {
  return (
    <div style={{ width:340,flexShrink:0,opacity:on?1:0,transform:on?'none':'translateX(-12px)',transition:'opacity .4s var(--ease), transform .4s var(--ease)',pointerEvents:on?'auto':'none' }}>
      <div style={{ background:'var(--off-white)',border:'1px solid rgba(26,20,16,.12)',borderLeft:'3px solid var(--vermillion)',padding:'22px 24px',borderRadius:4,boxShadow:'0 18px 40px rgba(40,28,12,.1)' }}>
        <div style={{ display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:14 }}>
          <span className="mono-label" style={{ color:'var(--vermillion)' }}>Hook · {note.stage}</span>
          <span className="mono-label tabnum" style={{ color:'rgba(26,20,16,.4)' }}>{note.n}/07</span>
        </div>
        <h3 className="serif" style={{ fontSize:23,fontWeight:500,lineHeight:1.18,color:'var(--ink)',margin:'0 0 10px' }}>{note.title}</h3>
        <p style={{ fontSize:14.5,lineHeight:1.6,color:'rgba(26,20,16,.66)',margin:0 }}>{note.body}</p>
        <div style={{ marginTop:16,paddingTop:14,borderTop:'1px solid rgba(26,20,16,.1)',fontSize:12.5,color:'rgba(26,20,16,.45)',fontStyle:'italic',fontFamily:'var(--font-display)' }}>Rasa — onboarding · curator's note</div>
      </div>
    </div>
  );
}

function RasaApp() {
  const [step, setStep] = useState(0);
  const [sel, setSel] = useState([]);
  const [notes, setNotes] = useState(true);
  const next = () => setStep(s => s + 1);
  const screens = [
    <Welcome next={next} />,
    <Interests next={next} sel={sel} setSel={setSel} />,
    <HowItWorks next={next} />,
    <Notify next={next} />,
    <Reveal next={next} />,
    <Save next={next} />,
    <Home restart={() => { setStep(0); setSel([]); }} />,
  ];
  const tint = ['light','dark','light','dark','light','dark','dark'][step];
  return (
    <Stage width={830} height={960}>
      <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:26 }}>
        <div style={{ display:'flex',alignItems:'center',gap:40 }}>
          <PhoneFrame tint={tint} bg="#000">{screens[step]}</PhoneFrame>
          <Placard note={NOTES[step]} on={notes} />
        </div>
        <div style={{ display:'flex',alignItems:'center',gap:18 }}>
          <Dots n={7} i={step} color="var(--vermillion)" dim="rgba(110,30,42,.2)" />
          <div style={{ width:1,height:18,background:'rgba(26,20,16,.15)' }} />
          <button onClick={() => setNotes(v => !v)} className="mono-label" style={{ display:'flex',alignItems:'center',gap:8,color:notes?'var(--vermillion)':'rgba(26,20,16,.45)' }}>
            <span style={{ width:30,height:17,borderRadius:99,background:notes?'var(--vermillion)':'rgba(26,20,16,.2)',position:'relative',transition:'background .25s' }}>
              <span style={{ position:'absolute',top:2,left:notes?15:2,width:13,height:13,borderRadius:'50%',background:'#fff',transition:'left .25s var(--ease)' }} />
            </span>
            Designer's notes
          </button>
          {step > 0 && <button onClick={() => setStep(s => Math.max(0, s-1))} className="mono-label" style={{ color:'rgba(26,20,16,.4)' }}>← Back</button>}
        </div>
      </div>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RasaApp />);
</script>
</body>
</html>
